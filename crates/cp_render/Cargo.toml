[package]
name = "cp_render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.clippy]
# Not a sim crate: hash containers are fine here (see the workspace lint in the root Cargo.toml).
disallowed_types = "allow"
disallowed_methods = "allow"

[dependencies]
cp_sim.workspace = true
cp_transit.workspace = true
cp_traffic.workspace = true
cp_district.workspace = true
cp_core.workspace = true
cp_terrain.workspace = true
cp_net.workspace = true
cp_building.workspace = true
cp_zone.workspace = true
cp_content.workspace = true
cp_utility.workspace = true
cp_service.workspace = true
cp_industry.workspace = true
bevy_math.workspace = true
bytemuck = { version = "1", features = ["derive"] }
bevy = { workspace = true, features = ["3d"] }

[dev-dependencies]
cp_zone.workspace = true
# Writes the raster pictures of tests/building_budget.rs.
png.workspace = true
