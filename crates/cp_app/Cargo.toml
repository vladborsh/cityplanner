[package]
name = "cp_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.clippy]
# Client crate, not a sim crate: hash containers are fine here (see the workspace lint).
disallowed_types = "allow"
disallowed_methods = "allow"

[dependencies]
cp_core.workspace = true
cp_sim.workspace = true
cp_terrain.workspace = true
cp_net.workspace = true
cp_building.workspace = true
cp_economy.workspace = true
cp_transit.workspace = true
cp_traffic.workspace = true
cp_utility.workspace = true
cp_save.workspace = true
cp_zone.workspace = true
cp_district.workspace = true
cp_content.workspace = true
cp_service.workspace = true
serde.workspace = true
ron.workspace = true
bevy_math.workspace = true
bevy_ecs.workspace = true
cp_render.workspace = true
cp_locale.workspace = true
cp_tools.workspace = true
cp_ui.workspace = true
cp_prof.workspace = true
# Rendering features are enabled in client crates only; sim crates never see them.
# `bevy_audio` + `wav`: the sound effects (T-189); the desktop client turns the device off for --hidden.
bevy = { workspace = true, features = ["3d", "bevy_audio", "wav"] }

[dev-dependencies]
cp_citizen.workspace = true
cp_economy.workspace = true
