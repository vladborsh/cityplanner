[package]
name = "cp_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.clippy]
# Client crate, not a sim crate: hash containers are fine here (see the workspace lint).
disallowed_types = "allow"
disallowed_methods = "allow"

[dependencies]
cp_core.workspace = true
cp_sim.workspace = true
cp_terrain.workspace = true
cp_net.workspace = true
cp_building.workspace = true
cp_economy.workspace = true
cp_save.workspace = true
cp_zone.workspace = true
cp_content.workspace = true
serde.workspace = true
ron.workspace = true
bevy_math.workspace = true
bevy_ecs.workspace = true
cp_render.workspace = true
cp_tools.workspace = true
cp_ui.workspace = true
cp_prof.workspace = true
# Rendering features are enabled in client crates only; sim crates never see them.
bevy = { workspace = true, features = ["3d"] }
