[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/mapgen"]
# Vendored third-party crates are not workspace members (see vendor/*/PATCH.md).
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# Denied for every target of every crate (lib, tests, benches, examples). Non-sim crates
# (cp_render, cp_tools, cp_ui, cp_prof, apps/*, tools/*) opt out in their own [lints.clippy].
# A new crate is a sim crate by default; see clippy.toml.
disallowed_types = "deny"
# Same opt-out for the clock methods (`Instant::now`, `SystemTime::now`), see clippy.toml.
disallowed_methods = "deny"

# Temporary: bevy_egui 0.43.0-rc.1 with a WebGL2 shader fix, see vendor/bevy_egui/PATCH.md.
[patch.crates-io]
bevy_egui = { path = "vendor/bevy_egui" }

[workspace.dependencies]
# Bevy is pinned here and only here. A version bump is its own task.
bevy = { version = "=0.20.0", default-features = false }
bevy_egui = { version = "=0.43.0-rc.1", default-features = false, features = ["render", "default_fonts"] }
bevy_app = { version = "=0.20.0", default-features = false }
bevy_ecs = { version = "=0.20.0", default-features = false }
bevy_math = { version = "=0.20.0", default-features = false, features = ["std"] }
bevy_reflect = { version = "=0.20.0", default-features = false }
bevy_tasks = { version = "=0.20.0", default-features = false }
bevy_utils = { version = "=0.20.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
rand_core = { version = "0.10.1", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
ron = "0.12"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ruzstd = "0.9.0"
proptest = "1"
png = "0.17"
# UI icons (cp_ui): egui_extras is pinned to the egui that the vendored bevy_egui uses (0.36.x).
egui_extras = { version = "=0.36.2", default-features = false, features = ["image"] }
# PNG only: the icon decoder of egui_extras; other formats stay out of the build.
image = { version = "0.25", default-features = false, features = ["png"] }

cp_core = { path = "crates/cp_core" }
cp_content = { path = "crates/cp_content" }
cp_terrain = { path = "crates/cp_terrain" }
cp_net = { path = "crates/cp_net" }
cp_zone = { path = "crates/cp_zone" }
cp_building = { path = "crates/cp_building" }
cp_citizen = { path = "crates/cp_citizen" }
cp_traffic = { path = "crates/cp_traffic" }
cp_utility = { path = "crates/cp_utility" }
cp_economy = { path = "crates/cp_economy" }
cp_save = { path = "crates/cp_save" }
cp_sim = { path = "crates/cp_sim" }
cp_prof = { path = "crates/cp_prof" }
cp_render = { path = "crates/cp_render" }
cp_app = { path = "crates/cp_app" }
cp_tools = { path = "crates/cp_tools" }
cp_ui = { path = "crates/cp_ui" }

# SimRng forks per entity per tick; ChaCha and the generic rand_core code monomorphised
# in cp_core are ~100x slower unoptimised, which made sim tests take minutes.
# Optimising them in dev/test builds does not affect determinism.
[profile.dev.package.rand_chacha]
opt-level = 3
[profile.dev.package.ppv-lite86]
opt-level = 3
[profile.dev.package.cp_core]
opt-level = 3

# Browser build (scripts/build-web.sh): small and fast over pretty, no unwinding.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
