[package]
name = "cp_web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.clippy]
# Not a sim crate: hash containers are fine here (see the workspace lint in the root Cargo.toml).
disallowed_types = "allow"
disallowed_methods = "allow"

[dependencies]
cp_core.workspace = true
cp_app.workspace = true
cp_sim.workspace = true
cp_render.workspace = true
cp_tools.workspace = true
cp_ui.workspace = true
# `web` + `webgl2`: WebGL2 backend, single-threaded (system-design §15).
bevy = { workspace = true, features = ["3d", "web", "webgl2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only to read `?map=` from the page URL.
web-sys = { version = "0.3", features = ["Window", "Location"] }
