[package]
name = "cp_desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
cp_sim.workspace = true
cp_render.workspace = true
cp_tools.workspace = true
cp_ui.workspace = true
# Rendering features are enabled here only; sim crates never see them.
bevy = { workspace = true, features = ["3d"] }

[dev-dependencies]
gltf = { version = "1", default-features = false, features = ["import"] }
