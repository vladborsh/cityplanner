[package]
name = "cp_bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.clippy]
# Not a sim crate: hash containers are fine here (see the workspace lint in the root Cargo.toml).
disallowed_types = "allow"

[dependencies]
cp_sim.workspace = true
cp_prof.workspace = true
cp_terrain.workspace = true
cp_content.workspace = true
cp_save.workspace = true
cp_net.workspace = true
cp_traffic.workspace = true
cp_core.workspace = true
# Real worker threads for the pathfinding bench.
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
bevy_ecs.workspace = true
serde.workspace = true
bevy_math.workspace = true
serde_json = "1"


[dev-dependencies]
# The client's sim setup (`build_sim`), to prove bench `--map` starts from the same state.
# Test-only: the bench binary itself never links the render stack.
cp_app.workspace = true
