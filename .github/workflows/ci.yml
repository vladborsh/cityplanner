name: CI

# Push to master: the CI gate, then the web build goes to GitHub Pages
# (https://vladborsh.github.io/cityplanner/). Pull requests: the gate only.
# The merge gate is still the local scripts/gate.sh; CI runs scripts/ci-gate.sh (required checks,
# no test that needs a GPU or a window).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo in CI: the test build linked against Bevy otherwise fills the 14 GB ubuntu
  # runner disk ("No space left on device", ld Bus error).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies for Bevy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Toolchain version comes from rust-toolchain.toml (rustup installs it on first cargo call).
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: scripts/ci-gate.sh
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  web:
    needs: gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      # Must equal wasm-bindgen in Cargo.lock; scripts/build-web.sh checks it.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - run: scripts/build-web.sh
      - run: touch dist/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
